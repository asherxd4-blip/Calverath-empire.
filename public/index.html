<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calverath — Калверат Эзэнт Гүрэн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Ruslan+Display&family=Cormorant+Unicase:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070203; --blood:#a3121a; --ember:#ff5a3c; --gold:#d9a441; --bone:#eadfce; --dim:#b7a798;
  --d1:'Cormorant Garamond','Cormorant Unicase',Georgia,serif;
  --d2:'Cormorant Garamond','Cormorant Unicase',Georgia,serif;
  --body:'EB Garamond',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--ink);color:var(--bone);font:400 1.2rem/1.75 var(--body);-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:-2;background:#000 center top / cover no-repeat}
#veil{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(ellipse at 50% 25%,rgba(0,0,0,.15),rgba(0,0,0,.8) 85%),
  linear-gradient(rgba(8,0,0,.5),rgba(8,0,0,.7))}
#embers{position:fixed;inset:0;z-index:0;pointer-events:none}
#nav,#hero,main,footer{position:relative;z-index:1}

/* navigation */
#nav{position:sticky;top:0;z-index:30;display:flex;gap:.25rem;overflow-x:auto;justify-content:safe center;padding:.55rem 1rem;
  background:linear-gradient(rgba(0,0,0,.88),rgba(0,0,0,.72));backdrop-filter:blur(8px);border-bottom:1px solid rgba(163,18,26,.55);scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav a{color:var(--dim);text-decoration:none;font:1.08rem var(--d2);letter-spacing:.05em;padding:.3rem .85rem;white-space:nowrap}
#nav a:hover,#nav a:focus-visible{color:var(--ember);text-shadow:0 0 14px var(--blood);outline:none}

/* hero */
#hero{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 1.2rem 3rem}
#hero h1{margin:0;font:500 clamp(3rem,12vw,8rem)/1.05 'Cormorant Garamond','Cormorant Unicase',Georgia,serif;color:#f6e8d4;letter-spacing:.12em;text-transform:none;
  text-shadow:0 0 22px rgba(255,60,30,.55),0 0 70px rgba(163,18,26,.85),0 4px 0 #000;
  animation:kindle 2.6s ease-out both}
#hero .sub{margin:1.2rem 0 0;font:italic 500 clamp(1.5rem,4vw,2.4rem)/1.3 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;color:var(--ember);text-shadow:0 0 18px rgba(163,18,26,.9)}
#hero .tag{margin:.7rem 0 0;font:italic 1.25rem var(--body);color:var(--dim)}
.rule{display:flex;align-items:center;gap:1rem;width:min(420px,70vw);margin:2rem auto 0;color:var(--blood)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--blood))}
.rule::after{background:linear-gradient(270deg,transparent,var(--blood))}
.rule i{font-style:normal;font-size:1.3rem;color:var(--ember)}
@keyframes kindle{0%{opacity:0;filter:blur(14px);letter-spacing:.2em}60%{opacity:1}100%{filter:none;letter-spacing:.12em}}

/* panels */
main{width:min(1000px,94vw);margin:0 auto;padding-bottom:4rem}
.panel{position:relative;margin:0 0 3rem;padding:2.4rem clamp(1.2rem,4vw,3rem) 2.6rem;
  background:linear-gradient(rgba(12,3,4,.8),rgba(8,2,3,.86));backdrop-filter:blur(5px);
  border:1px solid rgba(163,18,26,.45);box-shadow:0 0 0 1px #000,0 25px 70px rgba(0,0,0,.75),inset 0 0 60px rgba(120,10,15,.14)}
.panel::before,.panel::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold);pointer-events:none;opacity:.8}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.panel>h2,.panel>h2[data-f]{margin:0 0 1.6rem;font:400 clamp(2rem,5.4vw,3.3rem)/1.1 var(--d1);color:#f6e8d4;text-shadow:0 0 24px rgba(163,18,26,.9),0 2px 0 #000;
  padding-bottom:1rem;border-bottom:1px solid;border-image:linear-gradient(90deg,var(--blood),transparent) 1}

.block{position:relative;margin-bottom:2rem}
.block:last-of-type{margin-bottom:.5rem}
.block h3{margin:0 0 .6rem;font:400 clamp(1.6rem,3.6vw,2.1rem)/1.2 var(--d2);color:var(--ember);text-shadow:0 0 14px rgba(163,18,26,.8)}
.p,.rdesc,.ren,.lt{white-space:pre-wrap;overflow-wrap:anywhere}
.p{max-width:68ch}
.drop .p::first-letter{font:400 4.6rem/.75 var(--d1);float:left;padding:.4rem .7rem 0 0;color:var(--ember);text-shadow:0 0 18px var(--blood)}
.withimg{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:2rem;align-items:start}
.fig{margin:0;display:flex;flex-direction:column;gap:.6rem;align-items:flex-start}
.fig img{width:100%;display:block;border:1px solid rgba(217,164,65,.55);box-shadow:0 0 40px rgba(163,18,26,.55),0 12px 30px #000}
.slot{width:100%;aspect-ratio:4/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;
  border:1px dashed rgba(217,164,65,.55);background:radial-gradient(circle,rgba(163,18,26,.18),rgba(0,0,0,.35));color:var(--dim);font:1.1rem var(--d2);letter-spacing:.04em}
.slot b{font-size:2.6rem;color:var(--blood);font-weight:400;line-height:1}
@media(max-width:760px){.withimg{grid-template-columns:1fr}}

/* ranks */
.ghead{display:flex;align-items:center;gap:1rem;margin:2.2rem 0 1rem}
.ghead:first-of-type{margin-top:.4rem}
.gname{margin:0;font:400 clamp(1.7rem,4vw,2.3rem)/1.15 var(--d2);color:var(--gold);text-shadow:0 0 16px rgba(163,18,26,.85)}
.ghead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--blood),transparent)}
.editing .ghead::after{display:none}
.ranks{display:grid;gap:.9rem}
.rank{position:relative;display:grid;grid-template-columns:3rem minmax(0,1fr);gap:1rem;padding:1.1rem 1.3rem;background:rgba(40,5,8,.5);border-left:3px solid var(--blood)}
.rnum{font:400 2.4rem/1 var(--d1);color:var(--blood);text-shadow:0 0 12px rgba(255,60,30,.35);text-align:center}
.rname{margin:0;font:400 1.75rem/1.2 var(--d2);color:#f6e8d4}
.rmn{font:500 1.15rem var(--body);color:var(--gold)}
.rdesc{margin:.35rem 0 0}
.ren{margin:.5rem 0 0;padding-left:.9rem;border-left:1px solid rgba(217,164,65,.4);font-style:italic;color:var(--dim);font-size:1.08rem}

/* laws */
.search{width:100%;margin:0 0 1.2rem;padding:.7rem 1rem;background:rgba(0,0,0,.55);border:1px solid rgba(163,18,26,.6);color:var(--bone);font:1.1rem var(--body)}
.search:focus{outline:2px solid var(--ember);outline-offset:1px}
.lgroup{margin-bottom:.7rem;border:1px solid rgba(163,18,26,.4);background:rgba(20,3,5,.5)}
.lhead{display:flex;align-items:center;gap:1rem;width:100%;padding:.85rem 1.1rem;background:none;border:0;color:#f6e8d4;text-align:left;font:400 clamp(1.3rem,3vw,1.7rem)/1.25 var(--d2);cursor:pointer}
.lhead:hover,.lhead:focus-visible{background:rgba(163,18,26,.18);outline:none}
.lhead .rn{min-width:2.6rem;color:var(--ember);font-size:1.9rem}
.lhead .car{margin-left:auto;color:var(--gold);transition:transform .25s}
.lgroup.open .car{transform:rotate(90deg)}
.lbody{display:none;padding:.2rem 1.1rem 1rem}
.lgroup.open .lbody{display:block}
.law{position:relative;display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:.8rem;padding:.75rem 0;border-top:1px solid rgba(163,18,26,.3)}
.ln{font:400 1.35rem/1.5 var(--d2);color:var(--ember)}
.lt{max-width:70ch}
.law[hidden],.lgroup[hidden]{display:none}
.nores{display:none;color:var(--dim);font-style:italic}

footer{text-align:center;padding:2rem 1rem 6rem;color:var(--dim);font-size:1rem;border-top:1px solid rgba(163,18,26,.35);background:rgba(0,0,0,.6)}

/* lock button */
#lock{position:fixed;right:14px;bottom:14px;z-index:40;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.65);border:1px solid rgba(163,18,26,.7);color:var(--dim);font:1.2rem var(--body);cursor:pointer;opacity:.55}
#lock:hover,#lock:focus-visible{opacity:1;color:var(--ember);outline:none;box-shadow:0 0 16px var(--blood)}
.editing #lock{display:none}

/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);backdrop-filter:blur(4px)}
#modal.on{display:flex}
#modal form{width:min(340px,90vw);padding:1.8rem;background:#100305;border:1px solid var(--blood);box-shadow:0 0 50px rgba(163,18,26,.6);text-align:center}
#modal h4{margin:0 0 1rem;font:400 1.8rem var(--d2);color:var(--gold)}
#modal input{width:100%;padding:.7rem;text-align:center;letter-spacing:.5em;font:1.5rem var(--body);background:#000;border:1px solid var(--blood);color:var(--bone)}
#modal input:focus{outline:2px solid var(--ember)}
#modal .err{min-height:1.4rem;margin:.6rem 0;color:var(--ember);font-size:1rem}
#modal .row{display:flex;gap:.6rem;justify-content:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* editing UI */
.btn,.ctl button,#bar button{font:1rem var(--body);color:var(--bone);background:#1a0507;border:1px solid rgba(217,164,65,.55);padding:.3rem .8rem;cursor:pointer;line-height:1.4}
.btn:hover,.ctl button:hover,#bar button:hover{background:var(--blood);border-color:var(--ember)}
.btn:focus-visible,.ctl button:focus-visible,#bar button:focus-visible{outline:2px solid var(--ember)}
.ctl{display:none;gap:.25rem;align-items:center;z-index:3}
.ctl button{padding:.1rem .55rem}
.ctl .x:hover{background:#7a0000}
.ctl .tag{font:.95rem var(--d2);color:var(--gold);margin-right:.5rem}
.editing .ctl{display:inline-flex}
.editing .block>.ctl,.editing .rank>.ctl,.editing .law>.ctl{position:absolute;top:.15rem;right:.15rem}
.editing .panel>.ctl{display:flex;justify-content:flex-end;margin-bottom:.8rem}
.editing .block,.editing .rank,.editing .law{padding-top:1.9rem}
.editing .block{border:1px dashed rgba(217,164,65,.25);padding-left:.9rem;padding-right:.9rem;padding-bottom:.9rem}
.editing .ghead .ctl{margin-left:auto}
.editing [data-f]{outline:1px dashed rgba(217,164,65,.4);outline-offset:3px;cursor:text;min-width:2ch;min-height:1.2em}
.editing [data-f]:focus{outline:1px solid var(--gold);background:rgba(217,164,65,.08)}
.editing [data-f]:empty::before{content:attr(data-ph);color:#8a7b6c;font-style:italic;font-family:var(--body);font-size:1rem;letter-spacing:0;text-shadow:none}
.editing .drop .p::first-letter{float:none;font:inherit;padding:0;color:inherit;text-shadow:none}
.addrow{margin-top:1.2rem;display:none}
.editing .addrow{display:block}
.editing .lhead{cursor:default}
.addsec{display:none;margin:0 0 3rem;padding:1.5rem;border:2px dashed var(--gold);background:rgba(0,0,0,.6);text-align:center}
.editing .addsec{display:block}
.addsec select{font:1.05rem var(--body);padding:.4rem;background:#000;color:var(--bone);border:1px solid var(--gold);margin-right:.5rem}
.editing .lgroup .lbody{display:block}
.editing .law[hidden]{display:grid}

#bar{display:none;position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:60;gap:.4rem;flex-wrap:wrap;justify-content:center;
  width:min(96vw,760px);padding:.6rem;background:rgba(10,2,3,.94);border:1px solid var(--gold);box-shadow:0 0 30px #000}
.editing #bar{display:flex}
#bar .primary{background:var(--blood);border-color:var(--ember)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;padding:.6rem 1.2rem;background:#000;border:1px solid var(--ember);color:var(--bone);opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* elegant heading weights */
.panel>h2,.panel>h2[data-f]{font-weight:600;font-size:clamp(2.2rem,5.8vw,3.6rem);letter-spacing:.02em}
.block h3{font-weight:600;font-size:clamp(1.8rem,3.8vw,2.3rem);letter-spacing:.02em}
.gname,.rname,.lhead,.lhead .rn,.ln,.rnum,#nav a,#modal h4,.slot,.ctl .tag{font-weight:600}
.gname{font-size:clamp(1.9rem,4.2vw,2.5rem)}
.rname{font-size:1.9rem}
.rnum{font-size:2.8rem;font-weight:700}
.lhead{font-size:clamp(1.4rem,3.2vw,1.85rem)}
.lhead .rn{font-size:2.1rem}
.ln{font-size:1.45rem}
#nav a{font-size:1.15rem;letter-spacing:.06em}
.drop .p::first-letter{font-weight:600;font-size:5rem}
/* slightly smaller overall scale */
html{font-size:88%}
main{width:min(920px,94vw)}
#hero{min-height:68vh;padding:4rem 1.2rem 2.5rem}
.panel{margin-bottom:2.4rem}
#lock{width:38px;height:38px}
@media(max-width:600px){html{font-size:84%}.panel{padding:1.8rem 1rem 2rem}}
</style>
</head>

ашигтай хамтын ажиллагааг бий болгож, цаашдын тогтвортой харилцааг төлөвлөнө."}, {"n": "2.5", "t": "Calverath-ын нэрийн өмнөөс гадаад улстай хэлэлцээ хийх, хамтран ажиллах санал тавих, эсвэл гэрээ байгуулах бүрэн эрх нь зөвхөн Хаан, Хатан болон Зөвлөлийн баталгаатай зөвшөөрлөөр хэрэгжих бөгөөд үүнийг иргэн дур мэдэн хэрэгжүүлэх эрхгүй."}, {"n": "2.6", "t": "Calverath улсын дотоод зохион байгуулалт, зөвлөлийн шийдвэр болон улсын нууцад хамаарах мэдээллийг гадаад улс, байгууллага, эсвэл иргэнд төрийн зөвшөөрөлгүйгээр задруулахыг хатуу хориглоно. Зөрчсөн тохиолдолд “Улсаас урвасан” гэж үзэж, хариуцлага тооцно."}, {"n": "2.7", "t": "Бусад улстай байгуулсан гадаад харилцааны гэрээ, хэлэлцээрийг цуцлах эсвэл нэмэлт өөрчлөлт оруулах асуудлыг зөвхөн Хаан, Хатан болон Зөвлөлийн хурлаар хэлэлцэж, албан ёсны мэдэгдэл гаргаснаар хүчин төгөлдөр болно."}, {"n": "2.8", "t": "Улс хооронд ямар ч шалтгаан, зориулалттай байсан 1,000,000 калдрае-аас дээш мөнгөн дүн шилжүүлэхийг хориглоно."}, {"n": "2.9", "t": "Калверат улсын иргэн айлчлан буй хугацаандаа өөр улсын хууль тогтоомжийг зөрчсөн тохиолдолд тухайн улсад оногдуулах шийтгэлийг Калверат улсын дор эдэлнэ."}]}, {"name": "Дүрийн зохицуулалт ба заалт", "items": [{"n": "3.1", "t": "Calverath улс нь аниме, манга, манхва, вэбтун, VTuber болон бүх төрлийн digital performer, animation-based character зэрэг хүний төрхөөс гажууд, уран дүрслэлтэй дүрүүдийг албан ёсоор хүлээн зөвшөөрдөг."}, {"n": "3.2", "t": "Calverath улсын иргэн нэгэн зэрэг хоёр аккаунттай байх буюу давхар дүр эзэмшихийг хориглоно.\nЗөрчсөн тохиолдолд тухайн иргэний бүх дүрийг шалган, Calverath дахь дүрийн эрхийг хүчингүй болгож, хураана."}, {"n": "3.3", "t": "Нэг дүр дээр 2–3 сарын турш тогтвортой, идэвхтэй үйл ажиллагаа явуулж үхүүлсэн иргэнд улсын зүгээс хүндэтгэл үзүүлж, тухайн дүрийг 7 хоногийн хугацаанд битүүмжлэн хамгаална."}, {"n": "3.4", "t": "Дүр солих буюу шинэ дүр үүсгэх тохиолдолд шинэ дүрийн нэр, үүсгэсэн сар, өдөр, огноо-г Calverath улсын дүр бүртгэгчид алба с 5 ба түүнээс дээш удаа гарсан иргэн нь Calverath-ын тугийн дор үнэнч зогсохгүй хэмээн үзэж, бүрэн гишүүнчлэлээс хасагдана. Дахин нэмэх боломжгүй.\n(Зайлшгүй шалтгаантай байсан бол тооцохгүй)"}]}, {"name": "Улсын гэрлэлт болон хүүхэд өргөж авах заалт", "items": [{"n": "5.1", "t": "Гэрлэлт нь заавал сүмийн баталгаанд үндэслэнэ. Батлуулалгүй гэрлэсэн тохиолдолд хууль бусд тооцогдож цуцлагдана."}, {"n": "5.2", "t": "Хоёр овог хооронд дээд тал нь гурван хос гэрлэх эрхтэй."}, {"n": "5.3", "t": "Эцэг эх салсан тохиолдолд хүүхэд сүмд үрчлэгдэх, овгийн үндсэн гишүүн болох, эсвэл чөлөөт хүүхдийн статусыг сонгож болно."}, {"n": "5.4", "t": "Ганц бие чөтгөр хүүхэд бүтээх буюу өргөж авах тохиолдолд хаан, хатнаас зөвшөөрөл авч, улсад 500 калдрае төлнө."}, {"n": "5.5", "t": "Calverath улс нь LGBTQ+ харилцааг бүрэн хүлээн зөвшөөрдөг бөгөөд иргэн хүссэнээрээ дурлаж, үерхэж, гэрлэх эрхтэй."}, {"n": "5.6", "t": "Өөр улсын иргэнтэй гэрлэх тохиолдолд Хоёр улсаас хоёр хос гэрлэх боломжтой бөгөөд гадаад улсын иргэнтэй гэрлэсэн иргэн дахин өөр улсын иргэнтэй гэрлэх боломжгүй. Гэрлэлт нь хоёр улсын төрийн тэргүүнээр бүрэн зөвшөөрөгдсөн байх ёстой."}, {"n": "5.7", "t": "Нүгэлтнүүд болон дээд цолтонгууд хоёр эхнэр эсвэл хоёр нөхөртэй байх боломжтой. Айдол нар гэрлэх эрхгүй. Мөнх мөнхийн туслах нар эзнээсээ зөвшөөрөл авч гэрлэх боломжтой."}, {"n": "5.8", "t": "Гэрлэлт цуцлах асуудлыг мөн адил сүмийн оролцоотойгоор шийдвэрлэх бөгөөд хоёр тал харилцан зөвшөөрсөн эсвэл нэг тал нь “Гэрлэлтийн тангараг” зөрчсөн нь тогтоогдвол цуцална. Салсан тохиолдолд тухайн хос дахин 1 сарын турш гэрлэх эрхгүй (гашуудах эсвэл цээрлэх хугацаа)."}]}, {"name": "Нас, ажил, цалингийн зохицуулалт", "items": [{"n": "6.1", "t": "Calverath улсын иргэдийн нас сар бүрийн төгсгөлөөр албан ёсоор нэмэгдэнэ. Насны нэмэгдэл нь төрийн бүртгэлд тусгагдаж, дараагийн шатны хариуцлага, давуу эрхэд нөлөөлнө."}, {"n": "6.2", "t": "Иргэн ажил эрхлэхийг хүсвэл тухайн ажлын нэгжийн ажил хариуцагчтай шууд холбогдон, зөвшөөрөлтэйгээр албан ёсоор бүртгүүлнэ.\n→ Нэг иргэн нэгэн зэрэг дээд тал нь 3 ажил хаших боломжтой."}, {"n": "6.3", "t": "Цалин нь 15 хоног тутамд нэг удаа тогтмол буух бөгөөд ажлын гүйцэтгэл, идэвх, сахилга бат зэргээс хамааран хэлбэлзэх боломжтой."}]}]}, {"id": "ranks", "type": "ranks", "title": "Цол Хэргэм", "groups": [{"name": "Хааны удам", "items": [{"name": "Emperor / Empress", "mn": "Хаан / Хатан", "desc": "Улсын төрийн тэргүүд, удирдагчид.", "en": "The supreme sovereigns of the Calverath Empire, bearers of ultimate authority, bound by oath and shadow alike."}, {"name": "Crown Prince / Crown Princess", "mn": "Титэмт Ханхүү / Титэмт Гүнж", "desc": "Төрийн тэргүүний үүрэг хариуцлага болон эзэн суудлыг залгамжлагч.", "en": ""}, {"name": "Prince / Princess", "mn": "Ханхүү / Гүнж", "desc": "Өндөр үүрэг хариуцлага, хүндлэл хүлээсэн хааны удмын үр сад.", "en": ""}, {"name": "Infernium", "mn": "Инферниум", "desc": "Алтан цуст гэр бүлийн гишүүд", "en": "Members of the royal household. They carry the blood of the Empire in their veins."}, {"name": "Gehenna", "mn": "Геенна", "desc": "Алтан цуст гэр бүлийн хүүхдүүд", "en": "The children of the golden-blooded royal family. Born of divine shadow, they inherit the legacy of the throne and are raised within its eternal flame."}]}, {"name": "Язгууртан", "items": [{"name": "Avernus", "mn": "Авернус", "desc": "Калверат эзэнт гүрэнд хангалттай хувь нэмэр оруулж, дутагдалд өөрчлөлт гаргаж, улсдаа үнэнчээр бусдад болон алтан цуст гэр бүлд үнэлэгдэхүйц удаанаар зүтгэсэн иргэдэд олгогдох дээд зэрэглэлийн цол.", "en": "The highest of the three distinguished tiers, awarded to those who have made lasting contributions and earned the esteem of both the people and the royal bloodline."}, {"name": "Nocturnis", "mn": "Ноктурнис", "desc": "Калверат эзэнт гүрэнд хангалттай хувь нэмэр оруулж, дутагдалд өөрчлөлт гаргаж, улсдаа үнэнчээр бусдад болон алтан цуст гэр бүлд үнэлэгдэхүйц удаанаар зүтгэсэн иргэдэд олгогдох дунд зэрэглэлийн цол.", "en": "The middle distinction among those who have served faithfully and forged enduring change within the Empire's shadow."}, {"name": "Abyss", "mn": "Абисс", "desc": "Калверат эзэнт гүрэнд хангалттай хувь нэмэр оруулж, дутагдалд өөрчлөлт гаргаж, улсдаа үнэнчээр бусдад болон алтан цуст гэр бүлд үнэлэгдэхүйц удаанаар зүтгэсэн иргэдэд олгогдох анхдугаар зэрэглэлийн цол.", "en": "The foundational distinguished rank, granted to those who have proven their loyalty and worth through sustained, visible dedication to the Empire."}, {"name": "Sin", "mn": "Нүгэл", "desc": "Энэхүү цол нь хоёр болон түүнээс дээш овог байгууллагуудыг тогтвортой сайн удирдан залдаг, хийсэн зүйлсийнх нь үр шим ил тод харагдахуйц, ирээдүйд үлдэхүйц, ур чадвар сайтай эрхмүүдэд олгоно.", "en": "Granted to those who lead two or more clan organizations with enduring skill, whose accomplishments are visible and lasting, marking them as masters of their craft."}, {"name": "Mortalis", "mn": "", "desc": "Энэхүү цол нь овог байгууллага зэрэг улсад чухал нөлөө бүхий хүчин зүйлүүдийг удаан хугацаанд удирдан, амжилттай зохион байгуулж авч явсан ирээдүйд ч хийсэн ажлынх нь үр шим харагдах потенциалтай болгосон эрхмүүдэд олгоно.", "en": "Awarded to those who have long guided vital pillars of the state — clan organizations and beyond — with proven results whose legacy will echo into the future."}, {"name": "Vesperis", "mn": "", "desc": "Энэхүү цол нь Калверат улсад багагүй хугацааг өнгөрүүлсэн, идэвх санаачилгатай, өөрийн хариуцаж авсан ажлыг нягт нямбай хийдэг, улс орондоо чадах чинээгээрээ хувь нэмрээ оруулдаг нэгэнд олгогдоно.", "en": "Given to citizens who have spent considerable time in Calverath, show initiative, carry out their duties with care and precision, and contribute to the Empire to the best of their ability."}]}]}, {"id": "about", "type": "text", "title": "Нэмэлт мэдээлэл (Бидний Тухай)", "blocks": [{"h": "Мөнхийн Сүүдэр", "p": "Анхны үүр цайхаас ч өмнө Сүүдэр хэдийн эртний түүхтэй болсон байв. Калверат түүний гүнээс мэндэлсэн бөгөөд энэ бол амьд болон үхэшгүй мөнхийн хоорондох зааг ялгаа нь өглөөний хяруу мэт уусан алга болдог ертөнц байлаа.", "img": null}, {"h": "Skill Faith ЗЖРП харьяа.", "p": "Калверат Эзэнт Гүрэн нь ЗЖРП харьяанд орших газар доорх тамын улс юм.", "img": null}]}]}</script>
<script>
(function(){

/* ---- pin hashing (light obfuscation, not real security) ---- */
function cyrb53(str,seed){seed=seed||0;var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
var H=function(p){return cyrb53('calv|'+p)};

/* ---- data helpers ---- */
function get(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},D)}
function set(p,v){var ks=p.split('.'),last=ks.pop();ks.reduce(function(o,k){return o[k]},D)[last]=v}
function arrOf(p){var ks=p.split('.'),i=+ks.pop();return [get(ks.join('.')),i]}
var dirty=false,PIN='';

window.addEventListener('beforeunload',function(e){if(editing&&dirty){e.preventDefault();e.returnValue=''}});
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},3200)}
var uid=function(){return 's'+Math.random().toString(36).slice(2,8)};

var NEW={
  block:function(){return {h:'',p:'',img:null}},

};

function F(p,tag,cls,ph){var v=get(p)||'';if(!v&&!editing)return '';return '<'+tag+' class="'+(cls||'')+'" data-f="'+p+'" data-ph="'+esc(ph||'')+'">'+esc(v)+'</'+tag+'>'}
function ctl(p,pre){return '<span class="ctl">'+(pre||'')+'<button data-a="up" data-p="'+p+'" title="Move up" aria-label="Move up">↑</button><button data-a="dn" data-p="'+p+'" title="Move down" aria-label="Move down">↓</button><button class="x" data-a="del" data-p="'+p+'" title="Delete" aria-label="Delete">✕</button></span>'}
function addBtn(p,t,label){return '<div class="addrow"><button class="btn" data-a="add" data-p="'+p+'" data-t="'+t+'">+ '+label+'</button></div>'}

  if(has){
    fig='<figure class="fig">'+(b.img?'<img src="'+b.img+'" alt="">':'<div class="slot"><b>✠</b>Зураг энд орно</div>')+
      (editing?'<label class="btn">Choose image<input type="file" accept="image/*" hidden data-img="'+P+'.img"></label><button class="btn" data-a="rmimg" data-p="'+P+'">Remove image</button>':'')+'</figure>';
  }else if(editing){extra='<div><button class="btn" data-a="addimg" data-p="'+P+'">+ Add image</button></div>'}
  return '<div class="block'+(has?' withimg':'')+(b.drop?' drop':'')+'">'+ctl(P)+'<div class="btext">'+F(P+'.h','h3','','Heading (optional)')+F(P+'.p','div','p','Write your text here…')+extra+'</div>'+fig+'</div>';
}
function ranksHTML(s,P){
  return s.groups.map(function(g,gi){
    var GP=P+'.groups.'+gi;
    return '<div class="ghead">'+F(GP+'.name','h3','gname','Group name')+ctl(GP)+'</div><div class="ranks">'+
      g.items.map(function(r,ri){var RP=GP+'.items.'+ri;
        return '<article class="rank">'+ctl(RP)+'<div class="rnum" aria-hidden="true">'+(ri+1)+'</div><div>'+
          F(RP+'.name','h4','rname','Rank name (e.g. Emperor)')+F(RP+'.mn','div','rmn','Mongolian title')+F(RP+'.desc','p','rdesc','Description')+F(RP+'.en','p','ren','English description (optional)')+'</div></article>'}).join('')+
      '</div>'+addBtn(GP+'.items','rank','Add rank');
  }).join('')+addBtn(P+'.groups','rgroup','Add rank group');
}
function lawsHTML(s,P){
  var out=editing?'':'<input class="search" type="search" placeholder="Дүрэм хайх…" aria-label="Search laws">';
  out+=s.groups.map(function(g,gi){
    var GP=P+'.groups.'+gi;
    var head=editing?'<div class="lhead"><span class="rn">'+(gi+1)+'</span>'+F(GP+'.name','span','','Group title')+ctl(GP)+'</div>'
      :'<button class="lhead" data-a="tog" aria-expanded="false"><span class="rn">'+(gi+1)+'</span><span>'+esc(g.name)+'</span><span class="car" aria-hidden="true">▸</span></button>';
    return '<div class="lgroup">'+head+'<div class="lbody">'+g.items.map(function(l,li){var LP=GP+'.items.'+li;
      return '<div class="law">'+ctl(LP)+F(LP+'.n','span','ln','1.1')+F(LP+'.t','div','lt','Law text')+'</div>'}).join('')+addBtn(GP+'.items','law','Add law')+'</div></div>';
  }).join('');
  return out+'<div class="nores">Юу ч олдсонгүй.</div>'+addBtn(P+'.groups','lgroup','Add law group');
}
function sectionHTML(s,i){
  var P='sections.'+i,inner='';
  if(s.type==='text')inner=s.blocks.map(function(b,j){return blockHTML(b,P+'.blocks.'+j)}).join('')+addBtn(P+'.blocks','block','Add block');
  else if(s.type==='ranks')inner=ranksHTML(s,P);
  else if(s.type==='laws')inner=lawsHTML(s,P);
  return '<section class="panel t-'+s.type+'" id="'+s.id+'">'+ctl(P,'<span class="tag">'+(TYPENAME[s.type]||s.type)+'</span>')+F(P+'.title','h2','','Section title')+inner+'</section>';
}
function renderNav(){$('#nav').innerHTML=D.sections.map(function(s){return '<a href="#'+s.id+'">'+esc(s.title||'…')+'</a>'}).join('')}
function render(){
  $('#hero').innerHTML=F('hero.title','h1','','Site name')+F('hero.sub','p','sub','Subtitle')+F('hero.tag','p','tag','Tagline')+'<div class="rule"><i>✠</i></div>';
  $('#app').innerHTML=D.sections.map(sectionHTML).join('')+
    '<div class="addsec"><select id="newtype"><option value="text">Text section (paragraphs + pictures)</option><option value="ranks">Ranks section</option><option value="laws">Laws section</option></select><button class="btn" data-a="addsec">+ Add new section</button></div>';
  $('#footer').innerHTML=F('footer','div','','Footer text');
  renderNav();
  document.body.classList.toggle('editing',editing);
  $('#bg').style.backgroundImage='url("'+D.bg+'")';
  if(editing)document.querySelectorAll('[data-f]').forEach(function(el){try{el.contentEditable='plaintext-only'}catch(e){el.contentEditable='true'}});
}

/* ---- editing events ---- */
document.addEventListener('input',function(e){
  var el=e.target.closest&&e.target.closest('[data-f]');
  if(!el){return}
  var v=el.innerText.replace(/\u00a0/g,' ').replace(/\n$/,'');
  if(!v)el.innerHTML='';
  set(el.dataset.f,v);save();
  if(/\.title$/.test(el.dataset.f))renderNav();
});
document.addEventListener('paste',function(e){
  var el=e.target.closest&&e.target.closest('[data-f]');if(!el)return;
  e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'));
});
document.addEventListener('keydown',function(e){
  var el=e.target.closest&&e.target.closest('[data-f]');
  if(el&&e.key==='Enter'&&/^(H1|H2|H3|H4|SPAN)$/.test(el.tagName)||(el&&e.key==='Enter'&&el.classList.contains('rmn')))e.preventDefault();
  if(e.key==='Escape')closeModal();
});
function fileToURL(file,max,q,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    var x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=r.result};
  r.readAsDataURL(file);
}
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.img&&t.files[0]){fileToURL(t.files[0],1400,.86,function(u){set(t.dataset.img,u);save();render()})}
  if(t.id==='restorefile'&&t.files[0]){var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o.sections||!o.sections.length)throw 0;D=o;save();render();toast('Backup loaded. Click "Save to site" to publish it.')}catch(x){toast('That file is not a valid backup.')}};rd.readAsText(t.files[0]);t.value=''}
  if(t.id==='bgfile'&&t.files[0]){fileToURL(t.files[0],1800,.82,function(u){D.bg=u;save();render();toast('Background updated')});t.value=''}
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.dataset.a,p=b.dataset.p;
  if(a==='tog'){var g=b.closest('.lgroup');var o=g.classList.toggle('open');b.setAttribute('aria-expanded',o);return}
  if(a==='lock'){openModal();return}
  if(a==='exit'){editing=false;render();return}
  if(a==='publish'){publish();return}
  if(a==='backup'){backup();return}
  if(a==='restore'){$('#restorefile').click();return}
  if(a==='pin'){changePin();return}
  if(a==='reset'){if(confirm('Discard all unsaved changes and reload?')){dirty=false;location.reload()}return}
  if(a==='bg'){$('#bgfile').click();return}
  if(a==='up'||a==='dn'){var r=arrOf(p),arr=r[0],i=r[1],j=a==='up'?i-1:i+1;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t}
  else if(a==='del'){if(!confirm('Delete this item?'))return;var r2=arrOf(p);r2[0].splice(r2[1],1)}
  else if(a==='add'){get(p).push(NEW[b.dataset.t]())}
  else if(a==='addsec'){D.sections.push(NEW[$('#newtype').value]());render();save();var last=D.sections[D.sections.length-1];var el=document.getElementById(last.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  else if(a==='addimg'){set(p+'.img','')}
  else if(a==='rmimg'){set(p+'.img',null)}
  render();save();
});
document.addEventListener('input',function(e){
  if(!e.target.classList||!e.target.classList.contains('search'))return;
  var q=e.target.value.trim().toLowerCase(),sec=e.target.closest('.panel'),any=false;
  sec.querySelectorAll('.lgroup').forEach(function(g){
    var hits=0;
    g.querySelectorAll('.law').forEach(function(l){var m=!q||l.textContent.toLowerCase().indexOf(q)>-1;l.hidden=!m;if(m)hits++});
    g.hidden=q&&!hits;
    if(q&&hits){g.classList.add('open');any=true}
    var btn=g.querySelector('.lhead');if(btn&&btn.setAttribute)btn.setAttribute('aria-expanded',g.classList.contains('open'));
  });
  sec.querySelector('.nores').style.display=(q&&!any)?'block':'none';
});

/* ---- pin modal / toolbar ---- */
var fails=0,blockedUntil=0;
$('#ui').innerHTML=
 '<button id="lock" data-a="lock" aria-label="Edit site" title="Edit">✠</button>'+
 '<div id="modal" role="dialog" aria-modal="true" aria-label="Enter PIN"><form id="pinform" autocomplete="off"><h4>Enter the PIN</h4>'+
 '<input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN"><div class="err" id="pinerr" role="alert"></div>'+
 '<div class="row"><button type="submit" class="btn primary">Unlock</button><button type="button" class="btn" id="pincancel">Cancel</button></div></form></div>'+
 '<div id="bar"><button id="savebtn" data-a="publish" class="primary">Save to site</button><button data-a="bg">Change background</button><button data-a="pin">Change PIN</button><button data-a="backup">Download backup</button><button data-a="restore">Restore backup</button><button data-a="reset">Discard changes</button><button data-a="exit">Exit edit mode</button><input type="file" id="bgfile" accept="image/*" hidden><input type="file" id="restorefile" accept="application/json,.json" hidden></div>'+
 '<div id="toast" role="status"></div>';
function openModal(){$('#modal').classList.add('on');$('#pin').value='';$('#pinerr').textContent='';setTimeout(function(){$('#pin').focus()},30)}
function closeModal(){$('#modal').classList.remove('on')}
$('#pincancel').addEventListener('click',closeModal);
function api(body){
  return fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return {}}).then(function(j){j.status=r.status;j.ok=r.ok;return j})})
    .catch(function(){return {ok:false,status:0}});
}
$('#pinform').addEventListener('submit',function(e){
  e.preventDefault();
  var now=Date.now(),pin=$('#pin').value;
  if(now<blockedUntil){$('#pinerr').textContent='Too many attempts. Wait '+Math.ceil((blockedUntil-now)/1000)+'s.';return}
  $('#pinerr').textContent='Checking…';
  api({action:'auth',pin:pin}).then(function(r){
    if(r.ok){fails=0;PIN=pin;closeModal();editing=true;render();toast('Edit mode on. Click any text to change it.')}
    else if(r.status===401){fails++;$('#pinerr').textContent='Wrong PIN.';var f=$('#pinform');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('#pin').value='';if(fails>=5){blockedUntil=Date.now()+30000;fails=0}}
    else if(r.status===429){$('#pinerr').textContent='Too many attempts. Try again in a minute.'}
    else{$('#pinerr').textContent='Cannot reach the server. Is the function deployed?'}
  });
});
function publish(){
  var payload={action:'save',pin:PIN,data:D};
  if(JSON.stringify(payload).length>5.5*1024*1024){toast('Content is too large (over 5.5 MB). Remove or shrink some images.');return}
  toast('Saving…');
  api(payload).then(function(r){
    if(r.ok){dirty=false;$('#savebtn').textContent='Save to site';toast('Saved. Your site is updated.')}
    else if(r.status===401){toast('PIN rejected. Exit edit mode and unlock again.')}
    else if(r.status===413){toast('Content is too large. Shrink some images.')}
    else{toast('Save failed (error '+r.status+'). Your changes are still on this page.')}
  });
}
function changePin(){
  var n=prompt('Enter a new PIN (at least 4 characters):');
  if(!n)return;if(n.length<4){toast('PIN too short. Nothing changed.');return}
  api({action:'setpin',pin:PIN,newPin:n}).then(function(r){if(r.ok){PIN=n;toast('PIN changed.')}else toast('Could not change PIN (error '+r.status+').')});
}
function backup(){
  var blob=new Blob([JSON.stringify(D)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='calverath-backup.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---- embers ---- */
(function(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=$('#embers'),x=c.getContext('2d'),W,Hh,ps=[];
  function rs(){W=c.width=innerWidth;Hh=c.height=innerHeight}rs();addEventListener('resize',rs);
  function mk(init){return {x:Math.random()*W,y:init?Math.random()*Hh:Hh+10,r:Math.random()*1.8+.4,v:Math.random()*.5+.15,d:Math.random()*6.28,a:Math.random()*.6+.2}}
  for(var i=0;i<42;i++)ps.push(mk(true));
  (function tick(){
    x.clearRect(0,0,W,Hh);
    ps.forEach(function(p){p.y-=p.v;p.d+=.01;p.x+=Math.sin(p.d)*.4;if(p.y<-10)Object.assign(p,mk());
      x.beginPath();x.fillStyle='rgba(255,'+(90+p.r*30|0)+',60,'+p.a+')';x.shadowBlur=8;x.shadowColor='#ff3c1e';x.arc(p.x,p.y,p.r,0,6.283);x.fill()});
    requestAnimationFrame(tick);
  })();
})();

function boot(){
  var done=false,ctrl=window.AbortController?new AbortController():null;
  function go(d){if(done)return;done=true;if(d&&d.sections&&d.sections.length)D=d;render()}
  var to=setTimeout(function(){go(null);if(ctrl)ctrl.abort()},4000);
  fetch('/api/content',{cache:'no-store',signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.ok?r.json():null}).then(function(d){clearTimeout(to);go(d)}).catch(function(){clearTimeout(to);go(null)});
}
boot();
})();
</script>
